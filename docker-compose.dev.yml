# Dev container for unit tests (no NPU / prod server). Same Dockerfile as prod.
name: kokoro-rknn-dev

services:
  dev:
    image: kokoro-rknn-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: kokoro-rknn-dev
    user: "${RUNNER_UID:-0}:${RUNNER_GID:-0}"
    volumes:
      - .:/app
    working_dir: /app
